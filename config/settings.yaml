# Configuração do sistema de monitoramento de motorista.
# Todos os limiares e parâmetros ficam aqui, sem valores fixos no código.
# Caminhos relativos são resolvidos a partir da raiz do projeto.

capture:
  source: 0          # índice da webcam (0, 1, ...) ou caminho de um arquivo de vídeo
  width: 1280        # resolução pedida à webcam (ignorada em arquivos de vídeo)
  height: 720
  mirror: true       # espelha a imagem, como um espelho, para ficar natural na tela

models:
  face_landmarker: models/face_landmarker.task
  yolo: models/yolov8n.pt

face:
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5

drowsiness:
  ear_threshold: 0.20      # EAR abaixo disso = olho fechado (usado quando a calibração está desligada)
  hysteresis: 0.03         # o olho só volta a "aberto" com EAR >= limiar + histerese
  closed_seconds: 2.0      # olhos fechados de forma contínua por mais que isso = SONOLENCIA
  face_lost_grace: 1.0     # segundos sem rosto em que o último estado do olho é mantido
                           # (a cabeça pode cair ao cochilar); depois disso, zera
  calibration:
    enabled: true          # mede o EAR de olhos abertos no início e define o limiar
    seconds: 3.0           # tempo olhando para a câmera com os olhos abertos
    ratio: 0.65            # limiar = 65% do EAR mediano de olhos abertos

fatigue:                   # cansaço acumulado: aviso antecipado, mais brando que a SONOLENCIA
  perclos:                 # porcentagem do tempo com olhos fechados (Dinges e Grace, 1998)
    window_seconds: 60     # janela deslizante
    threshold: 0.15        # PERCLOS >= 15% = FADIGA
    hysteresis: 0.03       # só sai da FADIGA com PERCLOS abaixo de limiar - histerese
    min_observed_seconds: 30  # só avalia depois de 30 s de rosto visível na janela
  yawn:
    mar_threshold: 0.6     # MAR (lábios internos) acima disso = boca muito aberta
    min_seconds: 1.0       # boca muito aberta por pelo menos 1 s = bocejo (a fala não chega a isso)
    gap_tolerance: 0.2     # quedas rápidas do MAR durante o bocejo não zeram a contagem
    window_seconds: 300    # janela para contar bocejos (5 min)
    count: 3               # bocejos na janela = FADIGA

phone:
  class_name: cell phone   # classe do COCO (id 67 no modelo pré-treinado)
  confidence: 0.50         # confiança mínima de cada detecção
  imgsz: 640               # tamanho de entrada do YOLO
  filters:
    min_box_size: 0.06         # menor lado da caixa, em fração da altura do frame (~45 px em 720p)
    excluded_aspect: [0.8, 1.2] # descarta caixas quase quadradas (altura/largura nessa faixa),
                                # que costumam ser a mão; use null para desligar
    roi: [0.0, 0.0, 1.0, 1.0]   # região de interesse (x1, y1, x2, y2 em fração do frame);
                                # só conta celular com o centro dentro dela
  persistence:
    min_seconds: 1.0       # celular aceito por pelo menos esse tempo = CELULAR DETECTADO
    gap_tolerance: 0.5     # falhas de detecção mais curtas que isso não zeram a contagem

events:
  csv: logs/events.csv     # uma linha por evento; cada execução acrescenta ao final

alerts:
  sound: true              # bipe contínuo na SONOLENCIA; bipe curto no CELULAR e na FADIGA

telegram:                  # avisa a "central"; configure com: python scripts/telegram_setup.py
  enabled: true
  states: [SONOLENCIA, CELULAR DETECTADO, FADIGA]  # estados que geram mensagem
  cooldown_seconds: 60     # intervalo mínimo entre mensagens do mesmo estado
  send_photo: true         # envia a foto do momento (rosto do motorista: só com consentimento)
